services:
  - type: web
    name: shiguang-life-archive
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
